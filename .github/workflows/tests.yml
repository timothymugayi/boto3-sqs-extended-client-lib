name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pytest -q --tb=short -m "not localstack" --cov=pysqs_extended_client --cov-report=xml --cov-report=term-missing
          else
            pytest -q --tb=short -m "not localstack"
          fi
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          name: python-3.12
          fail_ci_if_error: true

  localstack:
    name: pytest (LocalStack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Start LocalStack
        run: docker compose up -d
      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://127.0.0.1:4566/_localstack/health >/dev/null; then
              echo "LocalStack is up"
              exit 0
            fi
            if [ -z "$(docker compose ps -q --status running)" ]; then
              echo "LocalStack container is not running"
              docker compose ps -a
              docker compose logs
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for LocalStack"
          docker compose logs
          exit 1
      - name: Run LocalStack tests
        env:
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
        run: pytest -q --tb=short -m localstack
      - name: Stop LocalStack
        if: always()
        run: docker compose logs && docker compose down
